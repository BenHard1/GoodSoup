name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder_key_000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Sécurité (RLS) et parcours utilisateurs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Démarrer Supabase local (migrations appliquées)
        run: npm run db:start

      - name: Exporter les variables Supabase locales
        run: |
          npx supabase status -o env > /tmp/sb.env
          set -a; source /tmp/sb.env; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "TEST_DATABASE_URL=$DB_URL"
            echo "MAILPIT_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}"
          } >> "$GITHUB_ENV"

      - name: Tests de sécurité (RLS)
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Installer Chromium pour Playwright
        # Les bibliothèques système de Chromium sont déjà présentes sur ubuntu-latest ;
        # éviter apt rend l'étape indépendante des miroirs Ubuntu.
        run: npx playwright install chromium

      - name: Parcours utilisateurs (mobile et ordinateur)
        run: npm run test:e2e -- --trace off

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
