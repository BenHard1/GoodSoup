name: Migrations Supabase

# Applique les migrations SQL aux projets hébergés.
# - staging : automatiquement à chaque fusion sur main ;
# - production : uniquement sur déclenchement manuel (onglet Actions > Run workflow).
# Secrets requis : SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID_STAGING, SUPABASE_DB_PASSWORD_STAGING,
#                  SUPABASE_PROJECT_ID_PROD, SUPABASE_DB_PASSWORD_PROD.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "Environnement cible"
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérifier la présence des secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Secrets Supabase absents : migration ignorée (projet hébergé pas encore configuré)."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Appliquer les migrations
        if: env.SKIP != '1'
        env:
          PROJECT_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'production') && secrets.SUPABASE_PROJECT_ID_PROD || secrets.SUPABASE_PROJECT_ID_STAGING }}
          SUPABASE_DB_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'production') && secrets.SUPABASE_DB_PASSWORD_PROD || secrets.SUPABASE_DB_PASSWORD_STAGING }}
        run: |
          echo "Cible : $TARGET"
          npx supabase link --project-ref "$PROJECT_ID"
          npx supabase db push
